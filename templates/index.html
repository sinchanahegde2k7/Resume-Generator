<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Resume Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <h1>🎓 AI Resume Generator</h1>
      <p>Fill in your details and let AI build your professional resume!</p>
    </div>

    <!-- Form -->
    <form action="/generate" method="POST">

      <!-- Personal Info -->
      <div class="section">
        <h2>👤 Personal Information</h2>
        <div class="grid">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" placeholder="e.g. Rahul Sharma" required/>
          </div>
          <div class="form-group">
            <label>Email Address *</label>
            <input type="email" name="email" placeholder="e.g. rahul@gmail.com" required/>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" name="phone" placeholder="e.g. 9876543210"/>
          </div>
          <div class="form-group">
            <label>City, State</label>
            <input type="text" name="location" placeholder="e.g. Chennai, Tamil Nadu"/>
          </div>
          <div class="form-group">
            <label>LinkedIn URL (optional)</label>
            <input type="text" name="linkedin" placeholder="linkedin.com/in/yourname"/>
          </div>
        </div>
      </div>

      <!-- Education -->
      <div class="section">
        <h2>🏫 Education</h2>
        <div class="grid">
          <div class="form-group">
            <label>Degree *</label>
            <input type="text" name="degree" placeholder="e.g. B.Tech Computer Science" required/>
          </div>
          <div class="form-group">
            <label>College / University *</label>
            <input type="text" name="college" placeholder="e.g. Anna University" required/>
          </div>
          <div class="form-group">
            <label>Graduation Year</label>
            <input type="text" name="grad_year" placeholder="e.g. 2026"/>
          </div>
          <div class="form-group">
            <label>Percentage / CGPA</label>
            <input type="text" name="percentage" placeholder="e.g. 8.5 CGPA"/>
          </div>
        </div>
      </div>

      <!-- Skills -->
      <div class="section">
        <h2>💻 Skills</h2>
        <div class="form-group">
          <label>Your Skills (comma separated)</label>
          <input type="text" name="skills"
            placeholder="e.g. Python, MS Excel, Communication, Teamwork"/>
        </div>
      </div>

      <!-- Projects -->
      <div class="section">
        <h2>🛠️ Projects</h2>
        <div class="form-group">
          <label>Project 1 (name + what it does) *</label>
          <textarea name="project1" rows="3"
            placeholder="e.g. Resume Generator — AI tool that creates resumes using Python and Gemini API"
            required></textarea>
        </div>
        <div class="form-group">
          <label>Project 2 (optional)</label>
          <textarea name="project2" rows="3"
            placeholder="e.g. Weather App — fetches live weather using OpenWeather API"></textarea>
        </div>
      </div>

      <!-- Experience -->
      <div class="section">
        <h2>💼 Internship / Experience</h2>
        <div class="form-group">
          <label>Internship or Work Experience (leave blank if none)</label>
          <textarea name="experience" rows="3"
            placeholder="e.g. Web Development Intern at XYZ Company, June 2024"></textarea>
        </div>
      </div>

      <!-- Achievements -->
      <div class="section">
        <h2>🏆 Achievements & Activities</h2>
        <div class="form-group">
          <label>Certifications, Clubs, Awards</label>
          <textarea name="achievements" rows="3"
            placeholder="e.g. Google Python Certificate, NSS Volunteer, Hackathon Winner"></textarea>
        </div>
      </div>

      <!-- Job Target -->
      <div class="section">
        <h2>🎯 Job Target</h2>
        <div class="form-group">
          <label>Role you are applying for *</label>
          <input type="text" name="job_role"
            placeholder="e.g. Python Developer Intern" required/>
        </div>
      </div>

      <!-- Submit -->
      <div class="submit-area">
        <button type="submit">⚡ Generate My Resume (PDF)</button>
      </div>

    </form>
  </div>

</body>
</html>
